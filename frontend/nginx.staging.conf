# Staging (docker-compose.staging.yml): igual ao nginx.conf da produção + senha de acesso na frente de tudo
# (página e /api). O arquivo de senhas fica só no servidor (deploy/staging.htpasswd, fora do git).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "WMS Staging";
    auth_basic_user_file /etc/nginx/staging.htpasswd;

    # SPA — qualquer rota do Angular cai no index.html. A index.html NUNCA vai pro cache: ela aponta pros bundles
    # (com hash) da versão atual — em cache, o navegador seguia na versão antiga depois do deploy (09/10/2026: tablet
    # ainda abria o modal antigo de faturamento pedindo a TOP).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # API → backend Ktor (nome do serviço no docker-compose.prod.yml)
    location /api/ {
        proxy_pass http://wms-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # uploads de imagem / respostas grandes de conferência
        client_max_body_size 25m;
        # 10 min: "Fechar OC" com muitos pedidos fatura um a um e passa de 2 min (OC 355: 156s — com 120s a tela
        # recebia 504 e mostrava "falha" com o fechamento ainda rodando e dando certo no servidor).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # assets estáticos com cache longo (bundles têm hash no nome)
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
