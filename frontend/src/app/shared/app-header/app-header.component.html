<header class="oq-header">
  <div class="oq-header__left">
    <button
      type="button"
      class="oq-header__nav-toggle"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAberto()"
      aria-label="Abrir menu de navegação"
    >
      <oq-icon name="menu" [size]="18" />
    </button>
    <div class="oq-header__logo">{{ contexto.unidade().iniciais }}</div>
    <div class="oq-header__unit-name">
      <span class="oq-header__unit-title">{{ contexto.unidade().nome }}</span>
      <span class="oq-header__version" [title]="contexto.unidade().versaoDetalhe">{{ contexto.unidade().versao }}</span>
    </div>
  </div>

  <div class="oq-header__divider" aria-hidden="true"></div>

  <div class="oq-header__center">
    <span class="oq-header__center-label">Unidade / Turno</span>
    <span class="oq-header__center-value">{{ contexto.unidade().unidadeTurno }}</span>
  </div>

  <div class="oq-header__right">
    <button
      type="button"
      class="oq-header__sync"
      [class.oq-header__sync--ativo]="sync.sincronizando()"
      (click)="sync.forcarSync()"
      [disabled]="sync.sincronizando()"
      [title]="sync.sincronizando() ? 'Sincronizando com o Sankhya…' : 'Toque para sincronizar com o Sankhya agora'"
    >
      <span class="oq-header__sync-icone">
        @if (sync.sincronizando()) {
          <oq-spinner [size]="14" />
        } @else {
          <oq-icon name="sync" [size]="14" />
        }
      </span>
      <span class="oq-header__sync-texto">
        <span class="oq-header__sync-titulo">
          {{ sync.sincronizando() ? 'Sincronizando…' : 'Sincronizado há ' + sync.segundosDesdeSync() + 's' }}
        </span>
        <span class="oq-header__sync-sub">
          {{ sync.sincronizando() ? 'buscando no Sankhya' : 'próximo em ' + sync.proximaSegundos + 's · toque p/ agora' }}
        </span>
        <span class="oq-header__sync-barra" aria-hidden="true">
          <span
            class="oq-header__sync-barra-fill"
            [style.width.%]="sync.sincronizando() ? 100 : (sync.segundosDesdeSync() / (sync.segundosDesdeSync() + sync.proximaSegundos)) * 100"
          ></span>
        </span>
      </span>
    </button>
    <button
      type="button"
      class="oq-header__theme-toggle"
      (click)="alternarTema()"
      [attr.aria-label]="tema() === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
      [attr.title]="tema() === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
    >
      <oq-icon [name]="tema() === 'dark' ? 'sun' : 'moon'" [size]="17" />
    </button>

    <div class="oq-header__operator">
      <div class="oq-header__avatar">{{ contexto.operador().iniciais }}</div>
      <div class="oq-header__operator-info">
        <span class="oq-header__operator-name">{{ contexto.operador().nome }}</span>
        <span class="oq-header__operator-role">{{ contexto.operador().codigo }} · {{ contexto.operador().cargo }}</span>
      </div>
    </div>
  </div>
</header>
