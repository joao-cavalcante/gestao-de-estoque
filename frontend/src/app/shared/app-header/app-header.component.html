<header class="oq-header">
  <div class="oq-header__left">
    <button
      type="button"
      class="oq-header__nav-toggle"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAberto()"
      aria-label="Abrir menu de navegação"
    >
      <oq-icon name="menu" [size]="18" />
    </button>
    <!-- Identidade em texto (17/11/2026, igual ao menu lateral): sem selo de iniciais. Versão na dica. -->
    <span class="oq-header__unit" [title]="contexto.unidade().versao + ' · ' + contexto.unidade().versaoDetalhe">
      <span class="oq-header__produto">Torre de Operação</span>
      <span class="oq-header__unit-sep" aria-hidden="true"></span>
      <span class="oq-header__unit-title">{{ contexto.unidade().nome }}</span>
      <span class="oq-header__unit-turno">· {{ contexto.unidade().turno }}</span>
    </span>
  </div>

  <div class="oq-header__right">
    <!-- Sync numa linha, sem contagem por segundo: hora da última atualização; falha em vermelho. -->
    <button
      type="button"
      class="oq-header__sync"
      [class.oq-header__sync--falha]="!!sync.falha() && !sync.sincronizando()"
      (click)="sync.forcarSync()"
      [disabled]="sync.sincronizando()"
      [title]="sync.falha() ? sync.falha() + ' Toque para tentar de novo.' : 'Atualiza sozinho a cada minuto. Toque para atualizar agora.'"
    >
      <span class="oq-header__sync-icone">
        @if (sync.sincronizando()) {
          <oq-spinner [size]="14" />
        } @else if (sync.falha()) {
          <oq-icon name="circle-alert" [size]="14" />
        } @else {
          <oq-icon name="sync" [size]="14" />
        }
      </span>
      <span class="oq-header__sync-texto">
        @if (sync.sincronizando()) {
          Atualizando…
        } @else if (sync.falha()) {
          Falha ao atualizar
        } @else {
          Atualizado às {{ horaAtualizacao() }}
        }
      </span>
    </button>

    <!-- Tema à vista (17/11/2026: dentro do menu do operador ninguém achava). -->
    <button
      type="button"
      class="oq-header__theme-toggle"
      [attr.aria-label]="tema() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'"
      [title]="tema() === 'dark' ? 'Tema claro' : 'Tema escuro'"
      (click)="alternarTema()"
    >
      <oq-icon [name]="tema() === 'dark' ? 'sun' : 'moon'" [size]="16" />
    </button>

    <!-- Operador: avatar + nome; cargo, crachá e Sair no menu. -->
    <div class="oq-header__operator-wrap">
      <button
        type="button"
        class="oq-header__operator"
        [attr.aria-expanded]="menuOperadorAberto()"
        aria-haspopup="menu"
        [title]="contexto.operador().cargo + ' · crachá ' + contexto.operador().codigo"
        (click)="menuOperadorAberto.set(!menuOperadorAberto()); $event.stopPropagation()"
      >
        <span class="oq-header__avatar">{{ contexto.operador().iniciais }}</span>
        <span class="oq-header__operator-name">{{ contexto.operador().nome }}</span>
      </button>

      @if (menuOperadorAberto()) {
        <div class="oq-header__menu" role="menu" (click)="$event.stopPropagation()">
          <div class="oq-header__menu-info">
            <span class="oq-header__menu-nome">{{ contexto.operador().nome }}</span>
            <span class="oq-header__menu-sub">{{ contexto.operador().cargo }} · crachá {{ contexto.operador().codigo }}</span>
          </div>
          <button type="button" class="oq-header__menu-item" role="menuitem" (click)="sair()">
            <oq-icon name="logout" [size]="14" />
            Sair
          </button>
        </div>
      }
    </div>
  </div>
</header>
