<footer class="oq-cf-footer">
  <!-- Banner de divergência removido por enquanto (pedido do usuário — visual "peba"). -->

  <div class="oq-cf-footer__actions">
    <div class="oq-cf-footer__actions-esquerda">
      <button
        type="button"
        class="oq-cf-footer__btn oq-cf-footer__btn--outline"
        title="Tudo que já foi bipado fica salvo — você pode continuar esta conferência depois, de qualquer dispositivo"
        (click)="voltar.emit()"
      >
        <oq-icon name="arrow-left" [size]="14" />
        {{ voltarLabel }}
      </button>
      <button type="button" class="oq-cf-footer__btn oq-cf-footer__btn--critico" (click)="cancelar.emit()">
        Cancelar Pedido
      </button>
    </div>

    <div class="oq-cf-footer__progress-group">
      <div class="oq-cf-footer__volume" [class.oq-cf-footer__volume--exige]="faltaVolume">
        @if (faltaVolume) {
          <span class="oq-cf-footer__volume-tooltip">
            <oq-icon name="circle-alert" [size]="11" />
            Informe os volumes pra confirmar
          </span>
        }
        <span class="oq-label-caps">VOLUMES{{ faltaVolume ? ' *' : '' }}</span>
        <button type="button" class="oq-cf-footer__volume-btn" (click)="onVolumeMenos()" [disabled]="volume === 0" aria-label="Diminuir volumes">−</button>
        <span class="oq-cf-footer__volume-valor">{{ volume }}</span>
        <button type="button" class="oq-cf-footer__volume-btn" (click)="onVolumeMais()" aria-label="Aumentar volumes">+</button>
      </div>

      <span class="oq-cf-footer__progress">
        PROGRESSO {{ progressoFeito }}/{{ progressoTotal }}
      </span>
      <button
        type="button"
        class="oq-cf-footer__btn oq-cf-footer__btn--primary"
        [disabled]="!canConfirm || confirmando"
        [title]="confirmando ? 'Enviando para o Sankhya — pode levar alguns segundos' : tituloBotaoPrimario"
        (click)="confirmar.emit()"
      >
        @if (confirmando) {
          <oq-spinner [size]="13" />
          Enviando…
        } @else {
          {{ confirmarLabel }}
        }
      </button>
    </div>
  </div>
</footer>
