<div class="oq-login-page">
  <div class="oq-login-card">
    <div class="oq-login-brand">
      <span class="oq-login-logo">LG</span>
      <span class="oq-login-title">LOGÍSTICA ÁGIL</span>
    </div>

    <div class="oq-login-abas">
      <button type="button" class="oq-login-aba" [class.oq-login-aba--ativa]="aba() === 'senha'" (click)="trocarAba('senha')">
        E-mail e senha
      </button>
      <button type="button" class="oq-login-aba" [class.oq-login-aba--ativa]="aba() === 'cracha'" (click)="trocarAba('cracha')">
        Crachá
      </button>
    </div>

    @if (aba() === 'senha') {
      <form class="oq-login-form" (ngSubmit)="entrar()">
        <label class="oq-login-field">
          <span class="oq-label-caps">E-mail</span>
          <input type="email" name="email" [(ngModel)]="email" autocomplete="username" required />
        </label>

        <label class="oq-login-field">
          <span class="oq-label-caps">Senha</span>
          <input type="password" name="senha" [(ngModel)]="senha" autocomplete="current-password" required />
        </label>

        @if (erro()) {
          <div class="oq-login-erro">{{ erro() }}</div>
        }

        <button type="submit" class="oq-login-btn" [disabled]="carregando()">
          {{ carregando() ? 'ENTRANDO…' : 'ENTRAR' }}
        </button>
      </form>
    } @else {
      <form class="oq-login-form" (ngSubmit)="entrarComCracha()">
        <label class="oq-login-field">
          <span class="oq-label-caps">Bipe o crachá</span>
          <input
            #inputCracha
            type="password"
            name="crachaoCodigo"
            [(ngModel)]="crachaoCodigo"
            [disabled]="carregando()"
            autocomplete="off"
            inputmode="none"
            (keydown.enter)="$event.preventDefault(); entrarComCracha()"
            (keydown.tab)="$event.preventDefault(); entrarComCracha()"
          />
        </label>

        @if (erro()) {
          <div class="oq-login-erro">{{ erro() }}</div>
        }

        <button type="submit" class="oq-login-btn" [disabled]="carregando() || !crachaoCodigo.trim()">
          {{ carregando() ? 'ENTRANDO…' : 'ENTRAR' }}
        </button>
      </form>
    }
  </div>
</div>
