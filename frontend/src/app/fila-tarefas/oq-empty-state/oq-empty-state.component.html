<div class="oq-empty-state" role="status">
  <p class="oq-empty-state__titulo">{{ titulo }}</p>
  @if (mensagem) {
    <p class="oq-empty-state__mensagem">{{ mensagem }}</p>
  }
  @if (podeLimpar) {
    <button type="button" class="oq-empty-state__limpar" (click)="limpar.emit()">Limpar filtros</button>
  }
</div>
