<div class="oq-toolbar">
  <div class="oq-toolbar__title-block">
    <h1 class="oq-toolbar__title">Fila de Tarefas</h1>
    <span class="oq-toolbar__counter">[ {{ visiveis }} / {{ total }} ]</span>
  </div>

  <div class="oq-toolbar__actions">
    <div class="oq-toolbar__pills" role="group" aria-label="Filtro por status">
      @for (pill of pills; track pill.valor) {
        <button
          type="button"
          class="oq-toolbar__pill oq-toolbar__pill--status"
          [class]="'oq-toolbar__pill--' + pill.valor"
          [class.oq-toolbar__pill--active]="filtroAtivo === pill.valor"
          [attr.aria-pressed]="filtroAtivo === pill.valor"
          (click)="filtroChange.emit(pill.valor)"
        >
          @if (pill.valor !== 'todos') {
            <span class="oq-toolbar__pill-dot" aria-hidden="true"></span>
          }
          {{ pill.label }}
        </button>
      }
    </div>

    @if (temSegmentacao) {
      <div class="oq-toolbar__pills oq-toolbar__pills--tipo-sep" role="group" aria-label="Filtro por tipo de separação">
        @for (tipo of tiposSeparacao; track tipo.id) {
          <button
            type="button"
            class="oq-toolbar__pill oq-toolbar__pill--icon"
            [class.oq-toolbar__pill--active]="tiposSeparacaoSelecionados.has(tipo.id)"
            (click)="tipoSeparacaoToggle.emit(tipo.id)"
          >
            <oq-icon [name]="tipo.icone" [size]="12" />
            {{ tipo.label }}
          </button>
        }
      </div>
    }

    <label class="oq-toolbar__search">
      <oq-icon name="search" [size]="12" />
      <input
        type="text"
        placeholder="BUSCAR PEDIDO / NF / CLIENTE / Nº ÚNICO"
        [ngModel]="termoBusca"
        (ngModelChange)="onBuscaInput($event)"
      />
    </label>

    <div class="oq-toolbar__pills" role="group" aria-label="Modo de visualização">
      @for (modo of modos; track modo.valor) {
        <button
          type="button"
          class="oq-toolbar__pill oq-toolbar__pill--icon oq-toolbar__pill--view"
          [class.oq-toolbar__pill--active]="viewMode === modo.valor"
          [attr.aria-pressed]="viewMode === modo.valor"
          [attr.aria-label]="modo.label"
          [title]="modo.label"
          (click)="viewModeChange.emit(modo.valor)"
        >
          <oq-icon [name]="modo.icone" [size]="14" />
        </button>
      }
    </div>

    <div class="oq-toolbar__filters-wrapper">
      <button
        type="button"
        class="oq-toolbar__filters-btn"
        [class.oq-toolbar__filters-btn--ativo]="filtrosAvancadosAtivos > 0"
        (click)="abrirFiltros.emit()"
      >
        <oq-icon name="filter" [size]="12" />
        Filtros
        @if (filtrosAvancadosAtivos > 0) {
          <span class="oq-toolbar__filters-badge">{{ filtrosAvancadosAtivos }}</span>
        }
      </button>

      @if (dropdownFiltrosAberto) {
        <oq-filtros-avancados
          [opcoesParceiros]="opcoesParceiros"
          [opcoesVendedores]="opcoesVendedores"
          [opcoesTiposOperacao]="opcoesTiposOperacao"
          [valores]="filtrosAvancados"
          (aplicar)="aplicarFiltrosAvancados.emit($event)"
          (fechar)="fecharFiltrosAvancados.emit()"
        />
      }
    </div>
  </div>
</div>
