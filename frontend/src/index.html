<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Torre de Operações</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Aplica o tema antes do bundle Angular carregar, pra não piscar o tema
    // errado (FOUC). Mesma chave/regra de resolução do ThemeService.
    (function () {
      try {
        var salvo = localStorage.getItem('wms_tema');
        var tema = salvo === 'light' || salvo === 'dark'
          ? salvo
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', tema);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
