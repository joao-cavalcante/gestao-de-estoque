server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — qualquer rota do Angular cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend Ktor (nome do serviço no docker-compose.prod.yml)
    location /api/ {
        proxy_pass http://wms-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # uploads de imagem / respostas grandes de conferência
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    # assets estáticos com cache longo (bundles têm hash no nome)
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
